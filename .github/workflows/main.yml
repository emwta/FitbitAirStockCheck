name: Stock Checker Bot

on:
  schedule:
    - cron: '*/5 * * * *' # แนะนำให้ปรับเป็น 30 นาทีถ้าใช้ Private Repo ป้องกันโควต้าหมด
  workflow_dispatch:

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # <-- เปลี่ยนเป็น v4

      - name: Set up Python
        uses: actions/setup-python@v5 # <-- เปลี่ยนเป็น v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium

      - name: Run Stock Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python stock_bot.py
