name: Check Stock

on:
  schedule:
    # Runs every 10 minutes. GitHub may delay this during high load.
    - cron: "*/59 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

# Avoid overlapping runs if one takes longer than 10 minutes.
concurrency:
  group: check-stock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed so the workflow can commit state.json back
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run stock check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: override the URL being watched without editing code.
          # PRODUCT_URL: ${{ secrets.PRODUCT_URL }}
        run: python check_stock.py

      - name: Commit updated state
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update stock state [skip ci]"
          git push
