name: Check Stock

on:
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  repository_dispatch:
    types: [stock-check]   # triggered externally, e.g. by cron-job.org calling the GitHub API

# Prevents a new run from starting while a previous one is still going.
concurrency:
  group: check-stock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Official Playwright image: Chromium + all system libraries are already
    # installed inside it, so we skip apt-get and the browser download that
    # were eating ~1-2 minutes of every run. Keep this tag's version in sync
    # with the "playwright" version pinned in requirements.txt.
    container:
      image: mcr.microsoft.com/playwright/python:v1.47.0-jammy
    permissions:
      contents: write   # needed so the workflow can commit state.json back
    steps:
      - name: Install git
        # The Playwright image doesn't ship git by default; checkout/commit need it.
        run: apt-get update && apt-get install -y --no-install-recommends git

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        # No "playwright install" step needed - Chromium is already in the image.

      - name: Run stock check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: override the URL being watched without editing code.
          # PRODUCT_URL: ${{ secrets.PRODUCT_URL }}
        run: python check_stock.py

      - name: Commit updated state
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update stock state [skip ci]"
          git push
