name: Check Stock

on:
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  repository_dispatch:
    types: [stock-check]   # triggered externally, e.g. by cron-job.org calling the GitHub API

# Prevents a new run from starting while a previous one is still going.
concurrency:
  group: check-stock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed so the workflow can commit state.json back
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Caches the downloaded Chromium binary (~150MB) keyed on the exact
      # playwright version in requirements.txt. First run after a version
      # bump will be slow (cache miss); every run after that skips the
      # download entirely and only takes a few seconds for system deps.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            # Browser binary already cached - just make sure system libs are present.
            playwright install-deps chromium
          else
            playwright install --with-deps chromium
          fi

      - name: Run stock check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: override the URL being watched without editing code.
          # PRODUCT_URL: ${{ secrets.PRODUCT_URL }}
        run: python check_stock.py

      - name: Commit updated state
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update stock state [skip ci]"
          git push
